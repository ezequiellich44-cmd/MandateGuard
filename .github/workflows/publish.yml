name: publish to mcp registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for OIDC (MCP registry)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m pip install -e ".[dev]" && python -m pytest -q

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          python -c "import json; p='server.json'; d=json.load(open(p)); d['version']=d['packages'][0]['version']='$VERSION'; d['packages'][0]['identifier']=d['packages'][0]['identifier'].replace('/v1.1.0/','/v'+d['version']+'/'); json.dump(d,open(p,'w'),indent=2)"

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish