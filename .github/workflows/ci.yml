name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m mandateguard.cli --state-dir "$RUNNER_TEMP/mg" set-scope --actor ci --tools pay && python -m mandateguard.cli --state-dir "$RUNNER_TEMP/mg" authorize --tool pay --destination 0xX --amount 1 --actor ci
