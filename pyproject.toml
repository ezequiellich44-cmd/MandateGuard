[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandateguard"
version = "1.0.0"
description = "Deterministic, auditable payment policy engine for autonomous AI agents. Enforces budgets, allowlists, and rate limits before any tool executes - no LLM in the decision path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eze Lech", email = "ezequiellich44@gmail.com" }]
keywords = ["ai-security", "mcp", "agents", "guardrails", "agentic-payments", "policy-engine", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
]

[project.scripts]
mandateguard = "mandateguard.cli:main"
mandateguard-mcp = "mandateguard.mcp.server:main"

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8", "fastmcp>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mandateguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]